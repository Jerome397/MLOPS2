[project]
name = "mlops2"
version = "0.1.0"
description = "Food-11 data preparation, MLflow training, serving and CI/CD labs"
readme = "README.md"
authors = [
    { name = "Jerome397", email = "jerome.khater@net.usj.edu.lb" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "mlflow>=3.16.1",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.1",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "uvicorn>=0.53.0",
    "numpy>=2.2",
    "dvc>=3.60",
    "requests>=2.32",
    "streamlit>=1.40",
]

[project.scripts]
mlops2 = "mlops2:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
link-mode = "copy"

[tool.ruff]
line-length = 100
