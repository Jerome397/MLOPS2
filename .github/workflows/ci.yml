name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "0.12.13"
      - run: uv sync --frozen
      - run: uv run ruff check src tests frontend
      - run: uv run pytest -q
  smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t food11-api:ci .
      - name: Measure single-stage versus multi-stage images
        run: |
          docker build -f .github/Dockerfile.single-stage -t food11-api:single .
          docker image inspect food11-api:ci food11-api:single --format '{{.RepoTags}} {{.Size}} bytes'
          docker history food11-api:ci
          multi=$(docker image inspect food11-api:ci --format '{{.Size}}')
          single=$(docker image inspect food11-api:single --format '{{.Size}}')
          echo "Multi-stage: $multi bytes; single-stage: $single bytes; saved: $((single-multi)) bytes" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Start container and probe health
        run: |
          docker run -d --name api -p 8000:8000 -e SKIP_MODEL=1 food11-api:ci
          for i in $(seq 1 30); do
            curl -sf localhost:8000/health && exit 0
            sleep 2
          done
          docker logs api
          exit 1
      - name: Build supporting Compose images
        run: |
          docker build -t food11-mlflow:ci mlflow
          docker build -t food11-frontend:ci frontend
      - name: Verify Compose artifact loading, predictions and persistence
        env:
          COMPOSE_FILE: docker-compose.yml:tests/integration/compose.ci.yml
          COMPOSE_PROJECT_NAME: food11-ci
        run: |
          docker compose up -d --no-build --wait mlflow
          docker compose run --rm --no-deps -T --entrypoint python inference /checks/seed_registry.py
          docker compose up -d --no-build --wait --wait-timeout 180
          docker compose exec -T inference python /checks/check_stack.py
          docker compose exec -T inference python /checks/advance_alias.py
          docker compose restart inference
          docker compose up -d --no-build --wait --wait-timeout 180
          docker compose exec -T inference python /checks/check_stack.py
          docker compose down
          docker compose up -d --no-build --wait --wait-timeout 180
          docker compose exec -T inference python /checks/check_stack.py
      - if: failure()
        run: docker compose -p food11-ci -f docker-compose.yml -f tests/integration/compose.ci.yml logs
      - if: always()
        run: |
          docker rm -f api || true
          docker compose -p food11-ci -f docker-compose.yml -f tests/integration/compose.ci.yml down -v

  push:
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/jerome397/mlops2:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
